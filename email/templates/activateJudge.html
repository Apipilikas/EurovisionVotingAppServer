<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Judge Account</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #333333; 
            margin: 0; 
            padding: 0; 
            background-color: #d8ccfc; /* --eleventh-color */
        }

        .container { 
            width: 100%; 
            max-width: 600px; 
            margin: 20px auto; 
            border: 8px solid #6e45ec; /* --forth-color */
            background-color: #ffffff;
            overflow: hidden;
        }

        .header { 
            background-color: #3f1c71; /* --seventh-color */
            padding: 25px; 
            text-align: center; 
            color: #1dc0df; /* --fifth-color */
        }

        .content { 
            padding: 30px; 
        }

        .button-container { 
            text-align: center; 
            margin: 30px 0; 
        }

        .button { 
            background-color: #6e45ec; /* --third-color */
            color: #ffffff; 
            padding: 14px 30px; 
            text-decoration: none; 
            font-weight: bold; 
            display: inline-block;
            transition: background-color .2s ease-in-out;
        }

        .button:hover {
            background-color: #3f1c71;
            
        }

        .footer { 
            background-color: #3f1c71; /* --seventh-color */
            padding: 15px; 
            text-align: center; 
            font-size: 12px; 
            color: #d8ccfc; /* --eleventh-color */
        }

        h2 {
            text-align: center;
            color: #6e45ec; /* --forth-color */
        }

        h3 {
            text-align: center;
            color: #6e45ec; /* --ninth-color */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- <h1 style="margin:0;">Eurovision 2026</h1> -->
            <img src="cid:eurovision-logo" alt="Logo" width="200px">
        </div>
        <div class="content">
            <h2>Welcome to Eurovision Voting App 2026!</h2>
            <p>Dear {{judgeName}},</p>
            <p>You have requested to join the app for <strong>Eurovision 2026</strong>. Please click the button below to complete your registration and activate your account.</p>
            
            <div class="button-container">
                <a href="{{clientUrl}}?judgeCode={{judgeCode}}&activationToken={{activationToken}}" class="button">Register</a>
            </div>
            
            <h3>Thank you for registering!</h3>
        </div>
        <div class="footer">
            <p>Eurovision Voting App 2026</p>
            <p>Powered by Aggelos Pipilikas</p>
        </div>
    </div>
</body>
</html>
